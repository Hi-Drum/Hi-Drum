# Site settings
title: "Project Demo Site"
email: "anonymous@example.com"
email2: ""
description: > # this means to ignore newlines until "baseurl:"
  Project Demo Website
  
baseurl: "/demo" # the subpath of your site, e.g. /blog/
url: "https://anonymous.github.io" # the base hostname & protocol for your site

# Social media
twitter_username: ""
github_username: ""
cv_username: ""
phone: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# GitHub Pages specific
repository: anonymous/demo
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENCE

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/